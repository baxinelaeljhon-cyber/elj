
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student API Interface</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f4f4;
            color: #333;
        }

        h1, h2 {
            color: #234a80;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 10px 16px;
            margin: 5px 0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        input {
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            max-width: 100%;
            box-sizing: border-box;
        }

        #result, #greeting, #studentList {
            margin-top: 20px;
            padding: 15px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        hr {
            margin: 30px 0;
            border: 0;
            border-top: 1px solid #ccc;
        }

        .student-card {
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #fafafa;
        }
    </style>
</head>

<body>

    <h1>Student API Interface</h1>

    <!-- Student Information -->
    <h2>Student Information</h2>

    <button onclick="loadStudent()">
        Load Student Information
    </button>

    <div id="result" aria-live="polite">
        Student information will appear here.
    </div>

    <hr>

    <!-- Greeting API -->
    <h2>Greeting API</h2>

    <input
        type="text"
        id="nameInput"
        placeholder="Enter your first name"
    >

    <button onclick="sayHello()">Say Hello</button>

    <p id="greeting" aria-live="polite"></p>

    <hr>

    <!-- Students from Database -->
    <h2>Students from Database</h2>

    <button onclick="loadStudents()">Load Students</button>

    <div id="studentList" aria-live="polite">
        Student records will appear here.
    </div>

    <script>

        // Load individual student
        async function loadStudent() {

            const result = document.getElementById("result");

            result.textContent = "Loading student information...";

            try {

                const response = await fetch("/student");

                if (!response.ok) {
                    throw new Error("Failed to retrieve student data");
                }

                const data = await response.json();

                result.replaceChildren();

                const fields = [
                    ["Student ID", data.student_id],
                    ["Name", data.name],
                    ["Program", data.program],
                    ["Year", data.year],
                    ["Section", data.section]
                ];

                fields.forEach(([label, value]) => {

                    const p = document.createElement("p");
                    const b = document.createElement("b");

                    b.textContent = label + ": ";

                    p.appendChild(b);
                    p.appendChild(
                        document.createTextNode(String(value))
                    );

                    result.appendChild(p);

                });

            } catch (error) {

                result.textContent = "Unable to retrieve data.";

                console.error(error);

            }
        }


        // Greeting API
        async function sayHello() {

            const name = document
                .getElementById("nameInput")
                .value.trim();

            const greeting = document.getElementById("greeting");

            if (!name) {
                greeting.textContent = "Please enter your first name.";
                return;
            }

            greeting.textContent = "Loading greeting...";

            try {

                const response = await fetch(
                    "/hello?name=" + encodeURIComponent(name)
                );

                if (!response.ok) {
                    throw new Error("Failed to retrieve greeting");
                }

                const data = await response.json();

                greeting.textContent = data.message;

            } catch (error) {

                greeting.textContent = "Unable to retrieve greeting.";

                console.error(error);

            }
        }


        // Load all students from SQLite database
        async function loadStudents() {

            const studentList = document.getElementById("studentList");

            studentList.textContent = "Loading student records...";

            try {

                const response = await fetch("/students");

                if (!response.ok) {
                    throw new Error("Failed to retrieve students");
                }

                const data = await response.json();

                studentList.replaceChildren();

                if (data.length === 0) {
                    studentList.textContent = "No student records found.";
                    return;
                }

                data.forEach(student => {

                    const card = document.createElement("div");
                    card.className = "student-card";

                    const fields = [
                        ["Student ID", student.student_id],
                        ["Name", student.name],
                        ["Program", student.program],
                        ["Year", student.year],
                        ["Section", student.section]
                    ];

                    fields.forEach(([label, value]) => {

                        const p = document.createElement("p");
                        const b = document.createElement("b");

                        b.textContent = label + ": ";

                        p.appendChild(b);
                        p.appendChild(
                            document.createTextNode(String(value))
                        );

                        card.appendChild(p);

                    });

                    studentList.appendChild(card);

                });

            } catch (error) {

                studentList.textContent =
                    "Unable to retrieve student records.";

                console.error(error);

            }
        }

    </script>

</body>
</html>
